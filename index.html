<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEET Mock Test Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen font-sans">

  <!-- Header -->
  <header id="topHeader" class="bg-white p-3 shadow-md flex justify-between items-center sticky top-0 z-50">
    <div>
      <h1 class="text-base font-bold text-blue-600">NEET Mock Portal</h1>
      <p id="qIndicator" class="text-xs font-semibold text-gray-500">Full Paper View</p>
    </div>
    <div id="timerBox" class="hidden">
      <span id="timer" class="text-sm font-bold text-red-600 bg-red-50 px-2.5 py-1 rounded-lg border border-red-200">03:00:00</span>
    </div>
  </header>

  <!-- Setup Section -->
  <div id="setupSection" class="max-w-md mx-auto my-6 bg-white p-6 rounded-2xl shadow-lg border border-gray-100">
    <h2 class="text-xl font-bold mb-4 text-gray-800">Setup Your Test</h2>
    
    <label class="block text-xs font-bold text-gray-600 mb-1">Select NEET Question Paper (PDF):</label>
    <input type="file" id="pdfInput" accept=".pdf" class="mb-4 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white file:font-semibold hover:file:bg-blue-700">
    
    <label class="block text-xs font-bold text-gray-600 mb-1">Paste Answer Key (Comma Separated A,B,C,D...):</label>
    <textarea id="answerKeyInput" class="w-full h-28 p-3 border rounded-xl mb-4 text-xs font-mono focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Example: A,B,C,D,A,C,D,B... (180 answers)"></textarea>
    
    <button id="startBtn" class="w-full bg-green-600 hover:bg-green-700 text-white py-3 rounded-xl font-bold shadow-md transition">
      🚀 Start Test (Full Screen View)
    </button>
  </div>

  <!-- Main Test Area -->
  <div id="testArea" class="hidden flex-col items-center pb-44">
    
    <!-- Full-Width Scrollable PDF Container -->
    <div id="pdfViewerContainer" class="w-full max-w-3xl flex flex-col items-center space-y-3 p-2 my-2">
      <!-- PDF Pages will be appended dynamically here -->
    </div>

    <!-- Floating Bottom OMR & Control Bar -->
    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 shadow-2xl z-50 max-w-3xl mx-auto rounded-t-2xl">
      <div class="flex justify-between items-center mb-2 px-1">
        <span id="activeQText" class="text-sm font-bold text-blue-700">Question 1 / 180</span>
        <div class="space-x-1">
          <button onclick="changeQ(-1)" class="bg-gray-200 text-gray-700 text-xs px-3 py-1.5 rounded-lg font-bold">← Prev Q</button>
          <button onclick="changeQ(1)" class="bg-blue-600 text-white text-xs px-3 py-1.5 rounded-lg font-bold">Next Q →</button>
        </div>
      </div>

      <!-- Options Buttons -->
      <div class="grid grid-cols-4 gap-2 mb-2">
        <button onclick="selectAns('A')" class="opt-btn bg-gray-100 hover:bg-blue-50 text-gray-800 font-bold py-2.5 rounded-xl border border-gray-300">A</button>
        <button onclick="selectAns('B')" class="opt-btn bg-gray-100 hover:bg-blue-50 text-gray-800 font-bold py-2.5 rounded-xl border border-gray-300">B</button>
        <button onclick="selectAns('C')" class="opt-btn bg-gray-100 hover:bg-blue-50 text-gray-800 font-bold py-2.5 rounded-xl border border-gray-300">C</button>
        <button onclick="selectAns('D')" class="opt-btn bg-gray-100 hover:bg-blue-50 text-gray-800 font-bold py-2.5 rounded-xl border border-gray-300">D</button>
      </div>

      <button onclick="submitTest()" class="w-full bg-red-600 hover:bg-red-700 text-white py-2 rounded-xl text-xs font-bold shadow">
        Submit Final Exam
      </button>
    </div>

  </div>

  <!-- Result Section -->
  <div id="resultSection" class="hidden max-w-md mx-auto my-6 bg-white p-6 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold mb-2 text-center text-gray-800">NEET Test Result 🎉</h2>
    <div id="scoreDisplay" class="text-3xl font-extrabold text-blue-600 text-center mb-4"></div>
    
    <div id="summaryBox" class="flex justify-around bg-blue-50 p-3 rounded-xl mb-4 text-center font-bold text-xs">
      <div class="text-green-600" id="correctCount">Right: 0</div>
      <div class="text-red-600" id="wrongCount">Wrong: 0</div>
      <div class="text-gray-600" id="unattCount">Left: 0</div>
    </div>

    <div id="reviewGrid" class="max-h-60 overflow-y-auto space-y-1.5 text-xs p-2 border rounded-xl bg-gray-50 mb-4"></div>
    
    <button onclick="location.reload()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700">
      Start New Test
    </button>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    let pdfDoc = null;
    let userAnswers = {};
    let correctAnswers = [];
    let currentQ = 1;
    let totalQuestions = 180;
    let timeRemaining = 10800;
    let timerInterval = null;

    document.getElementById('startBtn').onclick = () => {
      const fileInput = document.getElementById('pdfInput');
      const keyRaw = document.getElementById('answerKeyInput').value;

      if (!fileInput.files.length) {
        alert("Kripya NEET Question Paper (PDF) select karein!");
        return;
      }

      correctAnswers = keyRaw.replace(/\s/g, '').split(',').map(x => x.toUpperCase());

      const file = fileInput.files[0];
      const reader = new FileReader();

      reader.onload = function (e) {
        const typedarray = new Uint8Array(e.target.result);
        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
          pdfDoc = pdf;
          document.getElementById('setupSection').classList.add('hidden');
          document.getElementById('testArea').classList.remove('hidden');
          document.getElementById('testArea').classList.add('flex');
          document.getElementById('timerBox').classList.remove('hidden');

          renderAllPages();
          updateActiveQ();
          startTimer();
        }).catch(err => {
          alert("PDF render nahi ho saki: " + err.message);
        });
      };
      reader.readAsArrayBuffer(file);
    };

    function renderAllPages() {
      const container = document.getElementById('pdfViewerContainer');
      container.innerHTML = '';

      for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
        pdfDoc.getPage(pageNum).then(page => {
          const canvas = document.createElement('canvas');
          canvas.className = "shadow-md rounded-lg bg-white w-full my-1 border";
          container.appendChild(canvas);

          const ctx = canvas.getContext('2d');
          const screenWidth = Math.min(window.innerWidth - 16, 768);
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const scale = screenWidth / unscaledViewport.width;
          const viewport = page.getViewport({ scale: scale });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          page.render({ canvasContext: ctx, viewport: viewport });
        });
      }
    }

    function selectAns(ans) {
      userAnswers[currentQ] = ans;
      updateActiveQ();
    }

    function changeQ(dir) {
      if (currentQ + dir >= 1 && currentQ + dir <= totalQuestions) {
        currentQ += dir;
        updateActiveQ();
      }
    }

    function updateActiveQ() {
      document.getElementById('activeQText').innerText = `Question ${currentQ} / ${totalQuestions} (Selected: ${userAnswers[currentQ] || 'None'})`;
      document.getElementById('qIndicator').innerText = `Q ${currentQ} Active`;

      const buttons = document.querySelectorAll('.opt-btn');
      buttons.forEach(btn => {
        if (userAnswers[currentQ] === btn.innerText) {
          btn.className = "opt-btn bg-blue-600 text-white font-bold py-2.5 rounded-xl shadow";
        } else {
          btn.className = "opt-btn bg-gray-100 text-gray-800 font-bold py-2.5 rounded-xl border border-gray-300";
        }
      });
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        let h = Math.floor(timeRemaining / 3600);
        let m = Math.floor((timeRemaining % 3600) / 60);
        let s = timeRemaining % 60;
        document.getElementById('timer').innerText = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          submitTest();
        }
      }, 1000);
    }

    function submitTest() {
      if (!confirm('Kya aap exam submit karna chahte hain?')) return;

      clearInterval(timerInterval);
      document.getElementById('testArea').classList.add('hidden');
      document.getElementById('timerBox').classList.add('hidden');
      document.getElementById('topHeader').classList.add('hidden');
      document.getElementById('resultSection').classList.remove('hidden');

      let score = 0, right = 0, wrong = 0, unattempted = 0;
      let reviewHtml = "";

      for (let i = 1; i <= totalQuestions; i++) {
        let user = userAnswers[i];
        let correct = correctAnswers[i - 1];

        if (user) {
          if (correct && user === correct) {
            score += 4;
            right++;
            reviewHtml += `<div class='p-1.5 rounded bg-green-50 border border-green-200 text-green-700'><b>Q${i}: Correct</b> (Your: ${user} | Sahi: ${correct}) [+4]</div>`;
          } else {
            score -= 1;
            wrong++;
            reviewHtml += `<div class='p-1.5 rounded bg-red-50 border border-red-200 text-red-700'><b>Q${i}: Wrong</b> (Your: ${user} | Sahi: ${correct || 'N/A'}) [-1]</div>`;
          }
        } else {
          unattempted++;
          reviewHtml += `<div class='p-1.5 rounded bg-gray-100 text-gray-600'><b>Q${i}: Unattempted</b> (Sahi: ${correct || 'N/A'}) [0]</div>`;
        }
      }

      document.getElementById('scoreDisplay').innerText = `Marks: ${score} / ${totalQuestions * 4}`;
      document.getElementById('correctCount').innerText = `Right: ${right}`;
      document.getElementById('wrongCount').innerText = `Wrong: ${wrong}`;
      document.getElementById('unattCount').innerText = `Left: ${unattempted}`;
      document.getElementById('reviewGrid').innerHTML = reviewHtml;
    }
  </script>
</body>
</html>

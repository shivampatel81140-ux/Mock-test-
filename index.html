 <!DOCTYPE html>
 <html lang="en">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quiz Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head><body class="bg-gray-100 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md p-6 mt-10">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-4">Quiz Test Portal</h1>
        <p class="text-gray-600 text-center mb-6">Test paper upload karein aur quiz shuru karein.</p>
        <div class="border-2 border-dashed border-gray-300 p-6 text-center rounded-lg mb-4">
            <input type="file" id="pdfInput" accept=".pdf" class="hidden" />
            <label for="pdfInput" class="bg-blue-600 text-white px-4 py-2 rounded-lg cursor-pointer hover:bg-blue-700">
                Upload PDF Paper
            </label>
        </div>
        <button class="w-full bg-green-600 text-white font-bold py-2 rounded-lg hover:bg-green-700">
            Start Test
        </button>
    </div>
</body>
          </html>

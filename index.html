<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEET Quiz Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

  <!-- Switcher -->
  <div class="max-w-xl mx-auto mb-4 flex gap-2">
    <button onclick="switchMode('entry')" class="flex-1 bg-gray-800 text-white py-2 rounded-lg font-bold">Admin Mode (Add Q)</button>
    <button onclick="switchMode('exam')" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold">Exam Mode (Test)</button>
  </div>

  <!-- ENTRY MODE -->
  <div id="entryMode" class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow">
    <h2 class="text-xl font-bold mb-4">Add Question</h2>
    <textarea id="qText" placeholder="Question yahan likhein..." class="w-full p-3 border rounded-lg mb-2"></textarea>
    <input type="text" id="optA" placeholder="Option A" class="w-full p-2 border rounded-lg mb-1">
    <input type="text" id="optB" placeholder="Option B" class="w-full p-2 border rounded-lg mb-1">
    <input type="text" id="optC" placeholder="Option C" class="w-full p-2 border rounded-lg mb-1">
    <input type="text" id="optD" placeholder="Option D" class="w-full p-2 border rounded-lg mb-4">
    <button onclick="addQ()" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">Add Question to Bank</button>
    <p id="statusMsg" class="mt-4 text-sm text-green-600 font-bold"></p>
  </div>

  <!-- EXAM MODE -->
  <div id="examMode" class="max-w-xl mx-auto bg-white p-6 rounded-2xl shadow hidden">
    <div class="flex justify-between items-center mb-4 border-b pb-2">
      <h2 class="font-bold text-gray-700" id="qNum">Q 1</h2>
      <div id="timer" class="text-red-600 font-bold">03:00:00</div>
    </div>
    <p id="qDisplay" class="text-lg font-medium mb-6"></p>
    <div id="optionsDisplay" class="space-y-3"></div>
    <div class="mt-8 flex gap-4">
      <button onclick="prevQ()" class="flex-1 bg-gray-200 py-3 rounded-lg font-bold">Prev</button>
      <button onclick="nextQ()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold">Next</button>
    </div>
  </div>

  <script>
    let questions = JSON.parse(localStorage.getItem('neet_questions') || '[]');
    let current = 0;

    // --- ADMIN FUNCTIONS ---
    function addQ() {
      const q = {
        text: document.getElementById('qText').value,
        options: [document.getElementById('optA').value, document.getElementById('optB').value, document.getElementById('optC').value, document.getElementById('optD').value]
      };
      questions.push(q);
      localStorage.setItem('neet_questions', JSON.stringify(questions));
      document.getElementById('statusMsg').innerText = "Question Saved! Total: " + questions.length;
      document.getElementById('qText').value = ''; // clear
    }

    // --- EXAM FUNCTIONS ---
    function switchMode(m) {
      if(m === 'entry') {
        document.getElementById('entryMode').classList.remove('hidden');
        document.getElementById('examMode').classList.add('hidden');
      } else {
        document.getElementById('entryMode').classList.add('hidden');
        document.getElementById('examMode').classList.remove('hidden');
        renderExam();
      }
    }

    function renderExam() {
      if(questions.length === 0) { alert("Pehle questions add karein!"); return; }
      const item = questions[current];
      document.getElementById('qNum').innerText = `Q ${current + 1} / ${questions.length}`;
      document.getElementById('qDisplay').innerText = item.text;
      const opDiv = document.getElementById('optionsDisplay');
      opDiv.innerHTML = '';
      item.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-gray-200 hover:bg-blue-50";
        btn.innerText = opt;
        opDiv.appendChild(btn);
      });
    }

    function nextQ() { if(current < questions.length -1) { current++; renderExam(); } }
    function prevQ() { if(current > 0) { current--; renderExam(); } }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Test Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Container -->
  <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-lg">
    
    <!-- Header -->
    <h1 class="text-2xl font-bold text-center text-blue-600 mb-2">Quiz Test Portal</h1>
    <p class="text-gray-500 text-center text-sm mb-6">PDF select karein aur Live Mock Test dein.</p>

    <!-- Upload Section -->
    <div id="uploadSection" class="border-2 border-dashed border-gray-300 p-6 text-center rounded-lg mb-4">
      <input type="file" id="pdfInput" accept=".pdf" class="hidden" />
      <label for="pdfInput" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg cursor-pointer hover:bg-blue-700 inline-block font-semibold">
        Upload PDF Paper
      </label>
      <p id="fileName" class="text-sm text-green-600 mt-3 font-medium"></p>
      
      <button id="startBtn" class="w-full bg-green-600 text-white font-bold py-2.5 rounded-lg hover:bg-green-700 mt-4 hidden">
        Start Test
      </button>
    </div>

    <!-- Live Quiz Section -->
    <div id="quizSection" class="hidden">
      <!-- Timer & Progress -->
      <div class="flex justify-between items-center mb-4 bg-blue-50 p-3 rounded-lg border border-blue-200">
        <span class="font-bold text-gray-700" id="questionTracker">Question 1/3</span>
        <span class="font-bold text-red-600" id="timer">Time Left: 05:00</span>
      </div>

      <!-- Question Box -->
      <div class="mb-6">
        <h2 id="questionText" class="text-lg font-semibold text-gray-800 mb-4">Question loading...</h2>
        <div id="optionsContainer" class="space-y-3">
          <!-- Options generated dynamically -->
        </div>
      </div>

      <!-- Controls -->
      <div class="flex justify-between">
        <button id="prevBtn" class="bg-gray-400 text-white px-4 py-2 rounded-lg font-semibold disabled:opacity-50" disabled>Previous</button>
        <button id="nextBtn" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700">Next</button>
        <button id="submitBtn" class="bg-red-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-red-700 hidden">Submit Test</button>
      </div>
    </div>

    <!-- Result Section -->
    <div id="resultSection" class="hidden text-center py-6">
      <h2 class="text-2xl font-bold text-gray-800 mb-2">Test Completed! 🎉</h2>
      <p class="text-gray-600 mb-4">Aapka Final Score:</p>
      <div id="scoreDisplay" class="text-4xl font-extrabold text-blue-600 mb-6">0 / 0</div>
      <button onclick="location.reload()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-bold hover:bg-blue-700">
        Restart New Test
      </button>
    </div>

  </div>

  <script>
    // Demo Mock Questions (PDF parsing ke bajaye standard test format)
    const mockQuestions = [
      {
        question: "Q1. Bharat ki Rajdhani kya hai?",
        options: ["Mumbai", "Delhi", "Kolkata", "Chennai"],
        correct: 1
      },
      {
        question: "Q2. Computer ka dimaag (Brain) kise kaha jata hai?",
        options: ["RAM", "ROM", "CPU", "Hard Disk"],
        correct: 2
      },
      {
        question: "Q3. Surya ke sabse paas kaun sa grah (planet) hai?",
        options: ["Mercury (Budh)", "Venus (Shukra)", "Earth (Prithvi)", "Mars (Mangal)"],
        correct: 0
      }
    ];

    let currentQuestionIndex = 0;
    let selectedAnswers = {};
    let timerInterval = null;
    let timeRemaining = 300; // 5 minutes in seconds

    const pdfInput = document.getElementById('pdfInput');
    const fileNameDisplay = document.getElementById('fileName');
    const startBtn = document.getElementById('startBtn');
    const uploadSection = document.getElementById('uploadSection');
    const quizSection = document.getElementById('quizSection');
    const resultSection = document.getElementById('resultSection');

    pdfInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        fileNameDisplay.textContent = `Selected File: ${e.target.files[0].name}`;
        startBtn.classList.remove('hidden');
      }
    });

    startBtn.addEventListener('click', () => {
      uploadSection.classList.add('hidden');
      quizSection.classList.remove('hidden');
      startTimer();
      loadQuestion();
    });

    function startTimer() {
      timerInterval = setInterval(() => {
        timeRemaining--;
        let minutes = Math.floor(timeRemaining / 60);
        let seconds = timeRemaining % 60;
        document.getElementById('timer').textContent = `Time Left: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          finishTest();
        }
      }, 1000);
    }

    function loadQuestion() {
      const q = mockQuestions[currentQuestionIndex];
      document.getElementById('questionTracker').textContent = `Question ${currentQuestionIndex + 1}/${mockQuestions.length}`;
      document.getElementById('questionText').textContent = q.question;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      q.options.forEach((opt, index) => {
        const isChecked = selectedAnswers[currentQuestionIndex] === index;
        const optionLabel = document.createElement('label');
        optionLabel.className = `flex items-center p-3 border rounded-lg cursor-pointer transition ${isChecked ? 'bg-blue-100 border-blue-500 font-medium' : 'hover:bg-gray-50 border-gray-200'}`;
        optionLabel.innerHTML = `
          <input type="radio" name="option" value="${index}" ${isChecked ? 'checked' : ''} class="w-4 h-4 text-blue-600 mr-3">
          <span>${opt}</span>
        `;
        optionLabel.addEventListener('click', () => {
          selectedAnswers[currentQuestionIndex] = index;
          loadQuestion();
        });
        optionsContainer.appendChild(optionLabel);
      });

      document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;

      if (currentQuestionIndex === mockQuestions.length - 1) {
        document.getElementById('nextBtn').classList.add('hidden');
        document.getElementById('submitBtn').classList.remove('hidden');
      } else {
        document.getElementById('nextBtn').classList.remove('hidden');
        document.getElementById('submitBtn').classList.add('hidden');
      }
    }

    document.getElementById('nextBtn').addEventListener('click', () => {
      if (currentQuestionIndex < mockQuestions.length - 1) {
        currentQuestionIndex++;
        loadQuestion();
      }
    });

    document.getElementById('prevBtn').addEventListener('click', () => {
      if (currentQuestionIndex > 0) {
        currentQuestionIndex--;
        loadQuestion();
      }
    });

    document.getElementById('submitBtn').addEventListener('click', () => {
      if (confirm('Kya aap test submit karna chahte hain?')) {
        clearInterval(timerInterval);
        finishTest();
      }
    });

    function finishTest() {
      quizSection.classList.add('hidden');
      resultSection.classList.remove('hidden');

      let score = 0;
      mockQuestions.forEach((q, idx) => {
        if (selectedAnswers[idx] === q.correct) {
          score++;
        }
      });

      document.getElementById('scoreDisplay').textContent = `${score} / ${mockQuestions.length}`;
    }
  </script>
</body>
</html>
